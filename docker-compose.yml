name: knowledge-graphs

x-memory-environment: &memory-environment
  MEMORY_DSN_FILE: /run/secrets/memory_dsn
  MEMORY_PROJECT_MAP_FILE: /app/memory_platform/projects.example.json
  MEMORY_ALLOWED_ORIGINS: ${MEMORY_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
  MEMORY_COOKIE_SECURE: ${MEMORY_COOKIE_SECURE:-0}
  MEMORY_OLLAMA_URL: http://ollama:11434
  MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-beam:cloud}
  MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-nomic-embed-text}
  MEMORY_BOOTSTRAP_PASSWORD_FILE: /run/secrets/memory_bootstrap
  MEMORY_EMBED_ENABLED: '1'
  MEMORY_MIGRATION_MAINTENANCE_WORK_MEM: ${MEMORY_MIGRATION_MAINTENANCE_WORK_MEM:-256MB}
  MEMORY_VECTOR_EXACT_FALLBACK_MS: ${MEMORY_VECTOR_EXACT_FALLBACK_MS:-1500}
  MEMORY_EMBED_BATCH_TIMEOUT: ${MEMORY_EMBED_BATCH_TIMEOUT:-60}
  MEMORY_EMBED_JOB_MAX_TIMEOUT: ${MEMORY_EMBED_JOB_MAX_TIMEOUT:-900}
  MEMORY_METRICS: ${MEMORY_METRICS:-internal}
  MEMORY_LOG_LEVEL: ${MEMORY_LOG_LEVEL:-INFO}
  MEMORY_CHUNK_CHARS: ${MEMORY_CHUNK_CHARS:-1500}
  MEMORY_CHUNK_OVERLAP: ${MEMORY_CHUNK_OVERLAP:-200}
  MEMORY_CHUNK_MAX: ${MEMORY_CHUNK_MAX:-200}
  MEMORY_EMBED_BATCH: ${MEMORY_EMBED_BATCH:-8}
  MEMORY_VECTOR_INDEXES: ${MEMORY_VECTOR_INDEXES:-nomic-embed-text:768}
  MEMORY_FUSION_K: ${MEMORY_FUSION_K:-60}
  MEMORY_FUSION_VALIDATED_BONUS: ${MEMORY_FUSION_VALIDATED_BONUS:-0.0001}
  MEMORY_FUSION_WEIGHTS: ${MEMORY_FUSION_WEIGHTS:-}

x-process: &process
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  ollama:
    image: nginx@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    environment:
      OLLAMA_UPSTREAM: ${OLLAMA_UPSTREAM:-host.docker.internal:11434}
      NGINX_ENTRYPOINT_QUIET_LOGS: '1'
    volumes: ['./ollama-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro']
    networks:
      inference: {gw_priority: 0}
      egress: {gw_priority: 100}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- -T 5 http://127.0.0.1:11434/api/version >/dev/null']
      interval: 10s
      timeout: 6s
      retries: 12
    security_opt: [no-new-privileges:true]

  memory-postgres:
    image: kairos-postgres:latest
    build: {context: ., dockerfile: memory_platform/Dockerfile, target: postgres-pgvector}
    profiles: [memory]
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD_FILE: /run/secrets/memory_postgres
    secrets: [memory_postgres]
    volumes: [memory-postgres-data:/var/lib/postgresql/data]
    networks: [memory-data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U memory -d agent_memory]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]

  memory-migrate:
    <<: *process
    image: kairos-api:latest
    build: {context: ., dockerfile: memory_platform/Dockerfile, target: api}
    profiles: [memory]
    restart: 'no'
    environment: *memory-environment
    secrets: [memory_dsn]
    entrypoint: [python, -m, memory_platform.admin]
    command: [migrate]
    networks: [memory-data]
    depends_on:
      memory-postgres: {condition: service_healthy}

  memory-bootstrap:
    <<: *process
    image: kairos-api:latest
    profiles: [memory-bootstrap]
    restart: 'no'
    environment: *memory-environment
    secrets: [memory_dsn, memory_bootstrap]
    entrypoint: [python, -m, memory_platform.admin]
    command: [bootstrap, --with-projects]
    networks: [memory-data]
    depends_on:
      memory-migrate: {condition: service_completed_successfully}

  memory-files:
    image: kairos-api:latest
    profiles: [memory-admin]
    restart: 'no'
    user: '0:0'
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -m, memory_platform.initialize]
    volumes: [memory-backups:/backups]

  memory-api:
    <<: *process
    image: kairos-api:latest
    build: {context: ., dockerfile: memory_platform/Dockerfile, target: api}
    profiles: [memory]
    restart: unless-stopped
    environment: *memory-environment
    secrets: [memory_dsn]
    networks: [memory-data, webui, inference]
    ports: ['127.0.0.1:8790:8790']
    depends_on:
      memory-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
    stop_grace_period: 30s

  memory-worker:
    <<: *process
    image: kairos-worker:latest
    build: {context: ., dockerfile: memory_platform/Dockerfile, target: worker}
    profiles: [memory]
    restart: unless-stopped
    environment: *memory-environment
    secrets: [memory_dsn]
    networks: [memory-data, inference]
    depends_on:
      memory-migrate: {condition: service_completed_successfully}
    stop_grace_period: 45s

  memory-web:
    <<: *process
    image: kairos-web:latest
    build: {context: ., dockerfile: memory_platform/Dockerfile.web, target: final}
    profiles: [memory]
    restart: unless-stopped
    networks: [webui]
    ports: ['127.0.0.1:5173:8080']
    depends_on:
      memory-api: {condition: service_healthy}
    tmpfs: ['/tmp:uid=101,gid=101,mode=1777']

  memory-admin:
    <<: *process
    image: kairos-operator:latest
    build: {context: ., dockerfile: memory_platform/Dockerfile, target: operator}
    profiles: [memory-admin]
    environment: *memory-environment
    secrets: [memory_dsn, memory_bootstrap]
    entrypoint: [python, -m, memory_platform.admin]
    volumes: [memory-backups:/backups]
    networks: [memory-data]

networks:
  memory-data: {internal: true}
  inference: {driver: bridge, internal: true, name: knowledge-graphs_inference}
  egress: {}
  webui: {driver: bridge, name: knowledge-graphs_webui}

volumes:
  memory-postgres-data: {name: knowledge-graphs_memory-postgres-data}
  memory-backups: {name: knowledge-graphs_memory-backups}

secrets:
  memory_postgres: {file: '${MEMORY_SECRETS_DIR:-./secrets}/postgres_password'}
  memory_dsn: {file: '${MEMORY_SECRETS_DIR:-./secrets}/dsn'}
  memory_bootstrap: {file: '${MEMORY_SECRETS_DIR:-./secrets}/bootstrap_password'}
