name: knowledge-graphs

x-memory-environment: &memory-environment
  MEMORY_DSN_FILE: /run/secrets/memory_dsn
  MEMORY_PROJECT_MAP_FILE: /app/memory_platform/projects.example.json
  MEMORY_ALLOWED_ORIGINS: ${MEMORY_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
  MEMORY_COOKIE_SECURE: ${MEMORY_COOKIE_SECURE:-0}
  MEMORY_OLLAMA_URL: http://ollama:11434
  MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}
  MEMORY_EXTRACT_ENABLED: ${MEMORY_EXTRACT_ENABLED:-0}
  MEMORY_CORPUS_ANSWER: ${MEMORY_CORPUS_ANSWER:-off}
  MEMORY_MOUNT_MCP: ${MEMORY_MOUNT_MCP:-1}  # the internal MCP of memory-api, deprecated; 0 unmounts it (T-51, removed in 0.5.0)
  MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-nomic-embed-text}
  MEMORY_BOOTSTRAP_PASSWORD_FILE: /run/secrets/memory_bootstrap
  MEMORY_EMBED_ENABLED: '1'
  MEMORY_MIGRATION_MAINTENANCE_WORK_MEM: ${MEMORY_MIGRATION_MAINTENANCE_WORK_MEM:-256MB}
  MEMORY_VECTOR_EXACT_FALLBACK_MS: ${MEMORY_VECTOR_EXACT_FALLBACK_MS:-1500}
  MEMORY_EMBED_BATCH_TIMEOUT: ${MEMORY_EMBED_BATCH_TIMEOUT:-60}
  MEMORY_EMBED_JOB_MAX_TIMEOUT: ${MEMORY_EMBED_JOB_MAX_TIMEOUT:-900}
  MEMORY_METRICS: ${MEMORY_METRICS:-internal}
  MEMORY_LOG_LEVEL: ${MEMORY_LOG_LEVEL:-INFO}
  MEMORY_CHUNK_CHARS: ${MEMORY_CHUNK_CHARS:-1500}
  MEMORY_CHUNK_OVERLAP: ${MEMORY_CHUNK_OVERLAP:-200}
  MEMORY_CHUNK_MAX: ${MEMORY_CHUNK_MAX:-200}
  MEMORY_EMBED_BATCH: ${MEMORY_EMBED_BATCH:-8}
  MEMORY_VECTOR_INDEXES: ${MEMORY_VECTOR_INDEXES:-nomic-embed-text:768}
  MEMORY_FUSION_K: ${MEMORY_FUSION_K:-60}
  MEMORY_FUSION_VALIDATED_BONUS: ${MEMORY_FUSION_VALIDATED_BONUS:-0.0001}
  MEMORY_FUSION_WEIGHTS: ${MEMORY_FUSION_WEIGHTS:-}
  MEMORY_ABSTAIN_THRESHOLDS: ${MEMORY_ABSTAIN_THRESHOLDS:-}  # abstention (parameter `abstain`): cosine threshold per embeddings model, `model=threshold,...`; empty = none yet (uncalibrated)
  MEMORY_ABSTAIN_DEFAULT: ${MEMORY_ABSTAIN_DEFAULT:-off}  # `on` abstains when the request does not say; `off` keeps the answer identical to before
  MEMORY_LOGIN_CONCURRENCY: ${MEMORY_LOGIN_CONCURRENCY:-2}  # password derivations of memory-api at once (login, change of password, new user): ~128 MB each, 2 fits memory-api at 1 GB (docs/configuration.md); more waiters get 503 `login_busy`

# json-file rotation of every service (T-55): 3 files of 10 MB each, so no container fills the disk with its log.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

# `cpus` defaults to 0 (no CPU quota) in every service: Docker refuses a container whose `cpus` is above the CPUs of the host, so no default may be a number
# that a one-vCPU host cannot meet. A quota is a choice of the operator (docs/configuration.md has the column for a small VPS).
x-process: &process
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

services:
  ollama:
    image: nginx@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    mem_limit: ${MEMORY_OLLAMA_MEM_LIMIT:-256m}
    cpus: ${MEMORY_OLLAMA_CPUS:-0}
    restart: unless-stopped
    environment:
      OLLAMA_UPSTREAM: ${OLLAMA_UPSTREAM:-host.docker.internal:11434}
      OLLAMA_ALLOW_CHAT: ${OLLAMA_ALLOW_CHAT:-0}
      NGINX_ENTRYPOINT_QUIET_LOGS: '1'
    volumes: ['./ollama-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro']
    # The VPS is Linux, where `host.docker.internal` does not exist unless it is declared: `host-gateway` makes it the host's address (Docker Desktop already has it).
    extra_hosts: ['host.docker.internal:host-gateway']
    logging: *logging
    networks:
      inference: {gw_priority: 0}
      egress: {gw_priority: 100}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- -T 5 http://127.0.0.1:11434/api/version >/dev/null']
      interval: 10s
      timeout: 6s
      retries: 12
    # Sin root (S-09, P-10): el proceso es el usuario `nginx` (101) y solo escribe en estos tmpfs; la plantilla se renderiza en conf.d.
    user: '101:101'
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /run:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  memory-postgres:
    image: kairos-postgres:latest
    mem_limit: ${MEMORY_POSTGRES_MEM_LIMIT:-4g}
    cpus: ${MEMORY_POSTGRES_CPUS:-0}
    build: {context: ., dockerfile: server/memory_platform/Dockerfile, target: postgres-pgvector}
    profiles: [memory]
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD_FILE: /run/secrets/memory_postgres
    secrets: [memory_postgres]
    logging: *logging
    volumes: [memory-postgres-data:/var/lib/postgresql/data]
    networks: [memory-data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U memory -d agent_memory]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]

  memory-migrate:
    <<: *process
    image: kairos-api:latest
    mem_limit: ${MEMORY_MIGRATE_MEM_LIMIT:-512m}
    cpus: ${MEMORY_MIGRATE_CPUS:-0}
    build: {context: ., dockerfile: server/memory_platform/Dockerfile, target: api}
    profiles: [memory]
    restart: 'no'
    environment: *memory-environment
    secrets: [memory_dsn]
    entrypoint: [python, -m, memory_platform.admin]
    command: [migrate]
    networks: [memory-data]
    depends_on:
      memory-postgres: {condition: service_healthy}

  memory-bootstrap:
    <<: *process
    image: kairos-api:latest
    mem_limit: ${MEMORY_BOOTSTRAP_MEM_LIMIT:-256m}
    cpus: ${MEMORY_BOOTSTRAP_CPUS:-0}
    profiles: [memory-bootstrap]
    restart: 'no'
    environment: *memory-environment
    secrets: [memory_dsn, memory_bootstrap]
    entrypoint: [python, -m, memory_platform.admin]
    command: [bootstrap, --with-projects]
    networks: [memory-data]
    depends_on:
      memory-migrate: {condition: service_completed_successfully}

  memory-files:
    image: kairos-api:latest
    mem_limit: ${MEMORY_FILES_MEM_LIMIT:-128m}
    cpus: ${MEMORY_FILES_CPUS:-0}
    profiles: [memory-admin]
    restart: 'no'
    user: '0:0'
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -m, memory_platform.initialize]
    logging: *logging
    volumes: [memory-backups:/backups]

  memory-api:
    <<: *process
    image: kairos-api:latest
    mem_limit: ${MEMORY_API_MEM_LIMIT:-2g}  # ~100 MB of base + 360 MB peak while one 120 MB maximum answer is rendered (the pool does not bound answers held in memory): 2g holds ~14 maximum answers at once, 1g ~5; see docs/configuration.md
    cpus: ${MEMORY_API_CPUS:-0}
    build: {context: ., dockerfile: server/memory_platform/Dockerfile, target: api}
    profiles: [memory]
    restart: unless-stopped
    environment: *memory-environment
    secrets: [memory_dsn]
    networks: [memory-data, webui, inference, mcp]
    ports: ['127.0.0.1:8790:8790']
    depends_on:
      memory-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
    stop_grace_period: 30s

  # kairos-mcp (C-03): the 34 MCP tools in front of /v1, with the caller's own credential. No database, no secret, no model proxy: its only
  # peer is memory-api, on the network `mcp` that they alone share (CA-09). The proxy reaches it from memory-web (T-52).
  memory-mcp:
    <<: *process
    image: kairos-mcp:latest
    mem_limit: ${MEMORY_MCP_MEM_LIMIT:-1g}  # one answer of up to 64 MiB is held about five times over while it is cut; see docs/configuration.md
    cpus: ${MEMORY_MCP_CPUS:-0}
    build: {context: ./mcp, dockerfile: Dockerfile}
    profiles: [memory]
    restart: unless-stopped
    environment:
      KAIROS_API_URL: http://memory-api:8790
      KAIROS_API_TIMEOUT: ${KAIROS_API_TIMEOUT:-30}
      KAIROS_ALLOWED_ORIGINS: ${MEMORY_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      KAIROS_MAX_BODY_BYTES: ${KAIROS_MAX_BODY_BYTES:-262144}
      KAIROS_VALIDATION_THREADS: ${KAIROS_VALIDATION_THREADS:-1}
    networks: [mcp]
    depends_on:
      memory-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6

  memory-worker:
    <<: *process
    image: kairos-worker:latest
    mem_limit: ${MEMORY_WORKER_MEM_LIMIT:-1g}
    cpus: ${MEMORY_WORKER_CPUS:-0}
    build: {context: ., dockerfile: server/memory_platform/Dockerfile, target: worker}
    profiles: [memory]
    restart: unless-stopped
    environment: *memory-environment
    secrets: [memory_dsn]
    networks: [memory-data, inference]
    depends_on:
      memory-migrate: {condition: service_completed_successfully}
    # Healthy while the worker's beat is on time (T-56): /tmp/kairos-worker-heartbeat (tmpfs of x-process) holds the epoch second by which the next beat is due (the loop
    # writes it every turn, the claim of a job rewrites it with the deadline of the first renewal and every lease renewal (every lease/3) renews it, all only while the
    # database answers). Unhealthy once that second has passed, or when the file is missing or unreadable; `unhealthy` shows interval x retries = 3 x 30 s = 90 s after
    # the deadline at the latest, for any MEMORY_LEASE_SECONDS and any MEMORY_WORKER_DB_BACKOFF_MAX (a test drives the whole loop and probes every 30 s).
    healthcheck:
      test: [CMD, python, -c, "import sys, time; sys.exit(0 if time.time() < float(open('/tmp/kairos-worker-heartbeat').read()) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 45s

  memory-web:
    <<: *process
    image: kairos-web:latest
    mem_limit: ${MEMORY_WEB_MEM_LIMIT:-256m}
    cpus: ${MEMORY_WEB_CPUS:-0}
    build: {context: ., dockerfile: web/Dockerfile, target: final}
    profiles: [memory]
    restart: unless-stopped
    networks: [webui, mcp]  # `mcp` (internal): the only way from the proxy to kairos-mcp, which routes /mcp (T-52)
    ports: ['127.0.0.1:5173:8080']
    depends_on:
      memory-api: {condition: service_healthy}
      memory-mcp: {condition: service_healthy}
    tmpfs: ['/tmp:uid=101,gid=101,mode=1777']
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- -T 3 http://127.0.0.1:8080/health/live >/dev/null']  # the proxy's own route (web/nginx.conf), not a call to memory-api
      interval: 15s
      timeout: 5s
      retries: 6

  memory-admin:
    <<: *process
    image: kairos-operator:latest
    mem_limit: ${MEMORY_ADMIN_MEM_LIMIT:-1g}
    cpus: ${MEMORY_ADMIN_CPUS:-0}
    build: {context: ., dockerfile: server/memory_platform/Dockerfile, target: operator}
    profiles: [memory-admin]
    environment: *memory-environment
    secrets: [memory_dsn, memory_bootstrap]
    entrypoint: [python, -m, memory_platform.admin]
    volumes: [memory-backups:/backups]
    networks: [memory-data]
    init: true  # python must not be PID 1: as PID 1 it ignores SIGTERM unless it installed a handler, and `docker stop` would then SIGKILL a copy half written

  # Scheduled external copy (C-01, P-02), opt-in: `docker compose --profile backup up -d memory-backup` (the installed project picks it up only at its next `up`).
  # `backup-cycle` makes an encrypted copy, verifies it, sends it to MEMORY_BACKUP_DESTINATION (dir:/offsite/... or rclone:<remote>:<path>), reads it back there and applies
  # the retention of both places, every MEMORY_BACKUP_INTERVAL. It encrypts for the PUBLIC recipients of /config/recipients.txt and cannot decrypt: no service mounts a private key.
  # ${MEMORY_BACKUP_CONFIG_DIR}: recipients.txt (public) and rclone.conf (the operator's remotes); ${MEMORY_BACKUP_OFFSITE_DIR}: the mounted directory of a `dir:` destination.
  memory-backup:
    <<: *process
    image: kairos-operator:latest
    mem_limit: ${MEMORY_BACKUP_MEM_LIMIT:-1g}
    cpus: ${MEMORY_BACKUP_CPUS:-0}
    build: {context: ., dockerfile: server/memory_platform/Dockerfile, target: operator}
    profiles: [backup]
    restart: unless-stopped
    environment:
      <<: *memory-environment
      MEMORY_BACKUP_DESTINATION: ${MEMORY_BACKUP_DESTINATION:-}
      MEMORY_BACKUP_INTERVAL: ${MEMORY_BACKUP_INTERVAL:-24h}
      MEMORY_BACKUP_REMOTE_KEEP: ${MEMORY_BACKUP_REMOTE_KEEP:-30}
      MEMORY_BACKUP_KEEP: ${MEMORY_BACKUP_KEEP:-7}
      MEMORY_BACKUP_REQUIRE_ENCRYPTION: ${MEMORY_BACKUP_REQUIRE_ENCRYPTION:-1}
      MEMORY_BACKUP_RECIPIENTS_FILE: /config/recipients.txt
      RCLONE_CONFIG: /config/rclone.conf
      HOME: /tmp
    secrets: [memory_dsn]
    entrypoint: [python, -m, memory_platform.admin]
    command: [backup-cycle, --loop]
    volumes:
      - memory-backups:/backups
      - ${MEMORY_BACKUP_CONFIG_DIR:-./backup-config}:/config:ro
      - ${MEMORY_BACKUP_OFFSITE_DIR:-./offsite}:/offsite
    networks: [memory-data]  # `dir:` needs no outside: docker-compose.backup-rclone.yml adds `egress` for an `rclone:` destination (T-54)
    init: true
    stop_grace_period: 60s

  # Round-trip probe (C-06), opt-in: `docker compose --profile probe up -d memory-probe` (the installed project picks it up only at its next `up`).
  # `probe --loop` writes a synthetic note through /v1 with the probe key, waits for its embed receipt, searches for it and retires it, then waits MEMORY_PROBE_INTERVAL seconds (the period is
  # the duration of a run plus the interval), and writes kairos_probe_* to the textfile of the volume (it also warns with `queue_stuck` above MEMORY_QUEUE_STUCK_SECONDS). The key is the FILE `probe-provision`
  # leaves in /backups/probe (the default of the command, never a variable); the DSN secret only purges the retired notes of the `kairos-probe` project (the one role of the installation: see docs/operations.md,
  # `memory_dsn` of the service). No ports: nothing reaches it, and it reaches memory-api over the internal database network.
  memory-probe:
    <<: *process
    image: kairos-operator:latest
    mem_limit: ${MEMORY_PROBE_MEM_LIMIT:-256m}
    cpus: ${MEMORY_PROBE_CPUS:-0}
    build: {context: ., dockerfile: server/memory_platform/Dockerfile, target: operator}
    profiles: [probe]
    restart: unless-stopped
    environment:
      <<: *memory-environment
      MEMORY_PROBE_URL: ${MEMORY_PROBE_URL:-http://memory-api:8790}
      MEMORY_PROBE_INTERVAL: ${MEMORY_PROBE_INTERVAL:-300}
      MEMORY_PROBE_TIMEOUT: ${MEMORY_PROBE_TIMEOUT:-120}
      MEMORY_QUEUE_STUCK_SECONDS: ${MEMORY_QUEUE_STUCK_SECONDS:-900}
    secrets: [memory_dsn]
    entrypoint: [python, -m, memory_platform.admin]
    command: [probe, --loop]
    # Least privilege: only the `probe` directory of the volume (compose `volume.subpath`, Docker Engine and Compose with that field; the directory must exist, `probe-provision` creates it), mounted at the
    # path the defaults of the command use. The encrypted copies of memory-backup, next to it in the volume, are not visible to this service.
    volumes:
      - {type: volume, source: memory-backups, target: /backups/probe, volume: {subpath: probe}}
    networks: [memory-data]
    init: true
    # Healthy while the loop beats: the heartbeat file (only `probe --loop` writes it, at the start and the end of every cycle; an `admin probe` by hand writes the .prom but not this) is younger than
    # MEMORY_PROBE_INTERVAL + the longest cycle (MEMORY_PROBE_TIMEOUT + retirement + purge + queue read) + 60 s. The margin is computed by the code (`python -m memory_platform.probe health`).
    healthcheck:
      test: [CMD, python, -m, memory_platform.probe, health]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 15s  # the retirement after a SIGTERM has 8 s (docs/operations.md, "Sonda de ida y vuelta")

networks:
  memory-data: {internal: true}
  inference: {driver: bridge, internal: true, name: knowledge-graphs_inference}
  egress: {}
  webui: {driver: bridge, name: knowledge-graphs_webui}
  mcp: {driver: bridge, internal: true, name: knowledge-graphs_mcp}

volumes:
  memory-postgres-data: {name: knowledge-graphs_memory-postgres-data}
  memory-backups: {name: knowledge-graphs_memory-backups}

secrets:
  memory_postgres: {file: '${MEMORY_SECRETS_DIR:-./secrets}/postgres_password'}
  memory_dsn: {file: '${MEMORY_SECRETS_DIR:-./secrets}/dsn'}
  memory_bootstrap: {file: '${MEMORY_SECRETS_DIR:-./secrets}/bootstrap_password'}
