pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # The path without its query string: /memory-api/ rewrites `$uri` with the raw request URI (query included), and a query (a search, a corpus name)
    # must not reach the log.
    map $request_uri $safe_path { ~^(?<path>[^?]*) $path; default '-'; }
    log_format safe '$request_method $safe_path $status';
    access_log /dev/stdout safe;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 256k;
    proxy_max_temp_file_size 0;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # A named group, not a host in `proxy_pass`: a `proxy_pass` with a variable (the raw URI below) resolves a bare host name at run time and needs a resolver.
    upstream memory_api { server memory-api:8790; }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # The graph library injects its own CSS; script execution remains same-origin only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        location = / { expires -1; try_files /index.html =404; }
        location = /index.html { expires -1; try_files $uri =404; }
        location = /app { expires -1; try_files /portal.html =404; }
        location = /app/ { expires -1; try_files /portal.html =404; }
        location = /login { expires -1; try_files /portal.html =404; }
        location = /docs { expires -1; try_files /docs.html =404; }
        location = /docs/ { expires -1; try_files /docs.html =404; }
        location = /docs.html { expires -1; try_files $uri =404; }
        location = /kairos.svg { expires -1; try_files $uri =404; }
        location /brand/ { expires -1; try_files $uri =404; }
        location /handbook/ { expires -1; try_files $uri =404; }
        location = /portal.html { expires -1; try_files $uri =404; }
        location = /health/live { access_log off; return 200 'ok'; }
        location /assets/ { expires 365d; try_files $uri =404; }
        # /metrics is for the internal network only (MEMORY_METRICS=internal): never routed here, not even under the /memory-api/ prefix.
        location ~* ^(/memory-api)?/+metrics { return 404; }
        # /memory-api/ strips its prefix WITHOUT normalizing the rest: `proxy_pass` with a URI decodes `%2F` and resolves `//` and `..` first, so a corpus name
        # such as `a%2F..%2Fb` would reach the API as `b`. The raw request URI (query string included) is rewritten and sent as it came, like /v1/ does.
        location /memory-api/ {
            rewrite ^ $request_uri;
            rewrite ^/memory-api/(.*)$ /$1 break;
            return 400;
            proxy_pass http://memory_api$uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 45s;
            proxy_buffering off;
        }
        location /v1/ {
            proxy_pass http://memory-api:8790;
            proxy_set_header Host $http_host;
            proxy_read_timeout 45s;
            proxy_buffering off;
        }
        # `/mcp` is kairos-mcp (T-52, P-07). The internal MCP stays at memory-api:8790/mcp for the compatibility version and, while MEMORY_MOUNT_MCP=1,
        # is also reachable here as /memory-api/mcp/ (the generic /memory-api/ prefix above). kairos-mcp takes only a Bearer: the portal session cookie
        # is not forwarded to it.
        location /mcp {
            proxy_pass http://memory-mcp:8791;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_read_timeout 45s;
            proxy_buffering off;
        }
        location = /health/ready { proxy_pass http://memory-api:8790/health/ready; }
        location /api/ { return 404; }
        location / { return 404; }
    }
}
