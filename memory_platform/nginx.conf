pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$request_method $uri $status';
    access_log /dev/stdout safe;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 256k;
    proxy_max_temp_file_size 0;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # The graph library injects its own CSS; script execution remains same-origin only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        location = / { expires -1; try_files /index.html =404; }
        location = /index.html { expires -1; try_files $uri =404; }
        location = /app { expires -1; try_files /portal.html =404; }
        location = /app/ { expires -1; try_files /portal.html =404; }
        location = /login { expires -1; try_files /portal.html =404; }
        location = /docs { expires -1; try_files /docs.html =404; }
        location = /docs/ { expires -1; try_files /docs.html =404; }
        location = /docs.html { expires -1; try_files $uri =404; }
        location = /kairos.svg { expires -1; try_files $uri =404; }
        location /brand/ { expires -1; try_files $uri =404; }
        location /handbook/ { expires -1; try_files $uri =404; }
        location = /portal.html { expires -1; try_files $uri =404; }
        location = /health/live { access_log off; return 200 'ok'; }
        location /assets/ { expires 365d; try_files $uri =404; }
        # /metrics is for the internal network only (MEMORY_METRICS=internal): never routed here, not even under the /memory-api/ prefix.
        location ~* ^(/memory-api)?/+metrics { return 404; }
        location /memory-api/ {
            proxy_pass http://memory-api:8790/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 45s;
            proxy_buffering off;
        }
        location /v1/ {
            proxy_pass http://memory-api:8790;
            proxy_set_header Host $http_host;
            proxy_read_timeout 45s;
            proxy_buffering off;
        }
        location /mcp {
            proxy_pass http://memory-api:8790;
            proxy_set_header Host $http_host;
            proxy_read_timeout 45s;
            proxy_buffering off;
        }
        location = /health/ready { proxy_pass http://memory-api:8790/health/ready; }
        location /api/ { return 404; }
        location / { return 404; }
    }
}
